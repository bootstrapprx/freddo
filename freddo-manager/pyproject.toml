[project]
name = "freddo-manager"
version = "0.1.0"
description = "Console web de host único para operar distribuicoes Frappe/ERPNext gerenciadas pelo Frappe-Manager (fm)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psutil>=6.0",
    "pyjwt>=2.8",
    "pyotp>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-ulid>=3.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
freddo-manager = "freddo_manager.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/freddo_manager"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
ignore = ["BLE001", "S110", "S112", "SIM117", "SIM102", "PYI063"]
