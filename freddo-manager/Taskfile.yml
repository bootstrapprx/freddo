version: "3"

vars:
  VENV_DIR: "{{.ROOT_DIR}}/.venv"
  PYTHON: "{{.ROOT_DIR}}/.venv/bin/python"
  FREDDO_BIN: "{{.ROOT_DIR}}/.venv/bin/freddo-manager"
  WEB_DIR: "{{.ROOT_DIR}}/web"
  DEPLOY_DIR: "{{.ROOT_DIR}}/deploy"

  INSTALL_DIR: /opt/freddo-manager
  STATE_DIR: /var/lib/freddo-manager
  CONFIG_DIR: /etc/freddo-manager
  SYSTEMD_DIR: /etc/systemd/system
  BACKUP_DIR: /var/backups/freddo-manager
  BACKUP_HOME: "{{.STATE_DIR}}"

  # FM_HOME nao tem valor fixo: informe `FM_HOME=...` ou deixe `deploy:prereq`
  # solicitar em um terminal (padrao sugerido: $HOME/frappe no servidor).
  API_USER: freddo-api
  EXEC_USER: freddo
  COLLECTOR_USER: freddo-collector
  STATE_GROUP: freddo-manager
  EXECUTOR_UID: "1001"
  EXECUTOR_GID: "1001"

  PUBLIC_ORIGIN: https://console.example.com
  CORS_ORIGINS: '["https://console.example.com"]'
  CONTAINER_RUNTIME: auto
  DOCKER_SOCKET: /var/run/docker.sock
  PODMAN_SOCKET: ""
  XDG_RUNTIME_DIR: ""

tasks:
  default:
    desc: Lista as tarefas disponíveis
    cmds:
      - task --list

  deploy:preflight:
    desc: Diagnostica e corrige contas e sockets do runtime antes do deploy
    cmds:
      - |
        set -eu
        fail=0
        check() { label="$1"; shift; if ! "$@" >/dev/null 2>&1; then echo "FALTA: $label" >&2; fail=1; else echo "OK: $label"; fi; }
        as_exec() { if [ "$(id -u)" -eq 0 ]; then runuser -u '{{.EXEC_USER}}' -- "$@"; else sudo -u '{{.EXEC_USER}}' -H "$@"; fi; }
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO=sudo
        if [ "$(id -u)" -ne 0 ] && ! sudo -v; then
          echo 'FALTA: sudo autorizado para corrigir o host.' >&2
          exit 1
        fi
        check 'systemd/systemctl (deploy nativo)' command -v systemctl
        if [ ! -d /run/systemd/system ]; then
          echo 'FALTA: execute o deploy em um host Linux iniciado com systemd.' >&2
          exit 1
        fi
        check 'Python >= 3.12' python3 -c 'import sys; assert sys.version_info >= (3,12)'
        check 'Node.js >= 22' node -e 'process.exit(Number(process.versions.node.split(".")[0]) >= 22 ? 0 : 1)'
        check 'npm (build web)' command -v npm
        for user in '{{.API_USER}}' '{{.COLLECTOR_USER}}'; do
          if ! id -u "$user" >/dev/null 2>&1; then
            echo "Corrigindo: criando conta de serviço $user"
            $SUDO useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin "$user"
          fi
        done
        if ! getent group '{{.STATE_GROUP}}' >/dev/null; then
          echo "Corrigindo: criando grupo compartilhado {{.STATE_GROUP}}"
          $SUDO groupadd --system '{{.STATE_GROUP}}'
        fi
        if ! id -u "{{.EXEC_USER}}" >/dev/null 2>&1; then
          echo "FALTA: usuário {{.EXEC_USER}} dono dos benches (ajuste EXEC_USER ou crie-o)" >&2; fail=1
        else
          FM_HOME='{{.FM_HOME}}'
          [ -n "$FM_HOME" ] || FM_HOME="$(cat '{{.CONFIG_DIR}}/fm-home' 2>/dev/null || true)"
          [ -n "$FM_HOME" ] || FM_HOME="$(getent passwd '{{.EXEC_USER}}' | cut -d: -f6)/frappe"
          case "$FM_HOME" in
            /*)
              if [ ! -e "$FM_HOME" ]; then
                echo "Corrigindo: criando raiz de benches $FM_HOME"
                $SUDO install -d -o '{{.EXEC_USER}}' -g '{{.EXEC_USER}}' -m 755 "$FM_HOME"
              fi
              ;;
            *) echo "FALTA: FM_HOME deve ser absoluto ($FM_HOME)" >&2; fail=1 ;;
          esac
          if [ "$(id -u)" -eq 0 ]; then check runuser runuser -u '{{.EXEC_USER}}' -- true; fi
          check "FM_HOME acessível pelo dono dos benches: $FM_HOME" as_exec test -r "$FM_HOME"
          check "FM_HOME gravável pelo dono dos benches: $FM_HOME" as_exec test -w "$FM_HOME"
          check 'fmx no PATH do dono dos benches' as_exec sh -c 'command -v fmx'
          echo "Corrigindo: preparando estado compartilhado em {{.STATE_DIR}}"
          $SUDO install -d -o '{{.EXEC_USER}}' -g '{{.STATE_GROUP}}' -m 2770 '{{.STATE_DIR}}'
          for db in state.db telemetria.db; do
            database="{{.STATE_DIR}}/$db"
            if [ ! -f "$database" ]; then
              $SUDO install -o '{{.EXEC_USER}}' -g '{{.STATE_GROUP}}' -m 660 /dev/null "$database"
            fi
            $SUDO chgrp '{{.STATE_GROUP}}' "$database"
            $SUDO chmod 660 "$database"
            for suffix in '' -wal -shm; do
              file="{{.STATE_DIR}}/$db$suffix"
              if [ -f "$file" ]; then
                $SUDO chgrp '{{.STATE_GROUP}}' "$file"
                $SUDO chmod 660 "$file"
              fi
            done
          done
          if [ -f '{{.STATE_DIR}}/secret.key' ]; then
            $SUDO chgrp '{{.API_USER}}' '{{.STATE_DIR}}/secret.key'
            $SUDO chmod 640 '{{.STATE_DIR}}/secret.key'
          fi
        fi
        runtime='{{.CONTAINER_RUNTIME}}'
        PODMAN_SOCKET='{{.PODMAN_SOCKET}}'
        XDG_RUNTIME_DIR='{{.XDG_RUNTIME_DIR}}'
        if id -u '{{.EXEC_USER}}' >/dev/null 2>&1; then
          EXEC_UID="$(id -u '{{.EXEC_USER}}')"
          [ -n "$PODMAN_SOCKET" ] || PODMAN_SOCKET="/run/user/$EXEC_UID/podman/podman.sock"
          [ -n "$XDG_RUNTIME_DIR" ] || XDG_RUNTIME_DIR="/run/user/$EXEC_UID"
        fi
        if [ "$runtime" = auto ]; then
          if command -v docker >/dev/null 2>&1 && [ -S '{{.DOCKER_SOCKET}}' ]; then runtime=docker
          elif command -v docker >/dev/null 2>&1 && ! command -v podman >/dev/null 2>&1; then runtime=docker
          elif command -v podman >/dev/null 2>&1; then runtime=podman
          else runtime=docker; fi
        fi
        case "$runtime" in
          docker)
            check 'Docker CLI' command -v docker
            if [ ! -S '{{.DOCKER_SOCKET}}' ] && command -v docker >/dev/null 2>&1; then
              echo 'Corrigindo: habilitando Docker Engine'
              if ! $SUDO systemctl enable --now docker; then
                echo 'FALTA: Docker Engine instalado e com docker.service disponível.' >&2; fail=1
              fi
            fi
            check 'Docker socket {{.DOCKER_SOCKET}}' test -S '{{.DOCKER_SOCKET}}'
            ;;
          podman)
            check 'Podman CLI' command -v podman
            if [ -n "${EXEC_UID:-}" ] && [ ! -S "$PODMAN_SOCKET" ] && command -v podman >/dev/null 2>&1; then
              echo "Corrigindo: habilitando linger e socket rootless do Podman para {{.EXEC_USER}}"
              if ! $SUDO loginctl enable-linger '{{.EXEC_USER}}' ||
                 ! $SUDO systemctl start "user@$EXEC_UID.service" ||
                 ! $SUDO runuser -u '{{.EXEC_USER}}' -- env \
                   XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" \
                   DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus" \
                   systemctl --user enable --now podman.socket; then
                echo 'FALTA: serviço podman.socket rootless; confira o pacote Podman e o user manager.' >&2; fail=1
              fi
            fi
            check "Podman socket acessível por {{.EXEC_USER}}: $PODMAN_SOCKET" as_exec test -S "$PODMAN_SOCKET"
            ;;
          *) echo "FALTA: CONTAINER_RUNTIME deve ser auto, docker ou podman (atual: $runtime)" >&2; fail=1 ;;
        esac
        if [ "$fail" -ne 0 ]; then
          echo 'Doctor não conseguiu corrigir tudo. Instale/ajuste os itens marcados e rode novamente.' >&2
          exit 1
        fi
        echo "Doctor ok (runtime=$runtime; contas e socket verificados; benches preservados)"

  install:
    desc: Instala dependências Python e web
    cmds:
      - |
        set -eu
        if command -v uv >/dev/null 2>&1; then
          uv venv "{{.VENV_DIR}}"
          uv pip install -e '.[dev]'
        else
          python3 -m venv "{{.VENV_DIR}}"
          "{{.VENV_DIR}}/bin/pip" install -e '.[dev]'
        fi
      - npm --prefix "{{.WEB_DIR}}" ci

  build:
    desc: Gera o build estático da SPA
    cmds:
      - npm --prefix "{{.WEB_DIR}}" run build

  lint:
    desc: Ruff em backend e testes
    cmds:
      - '"{{.VENV_DIR}}/bin/ruff" check backend tests'

  test:
    desc: Testes de integração da API
    cmds:
      - '"{{.VENV_DIR}}/bin/pytest" -q'

  verify:
    desc: Ruff + pytest + lock + build
    cmds:
      - task: lint
      - task: test
      - task: build
      - |
        if command -v uv >/dev/null 2>&1; then
          uv lock --check
        fi

  dev:
    desc: Sobe API e Vite em paralelo (fmx/runtime reais)
    cmds:
      - '{{.PYTHON}} "{{.ROOT_DIR}}/scripts/dev.py" "{{.FREDDO_BIN}}" "{{.WEB_DIR}}"'

  dev:api:
    desc: Sobe apenas a API
    cmds:
      - '"{{.FREDDO_BIN}}" serve {{.CLI_ARGS}}'

  dev:web:
    desc: Sobe apenas o Vite
    cmds:
      - npm --prefix "{{.WEB_DIR}}" run dev

  runtime:
    desc: Mostra o runtime de containers detectado
    cmds:
      - '"{{.FREDDO_BIN}}" runtime'

  catalog:
    desc: Mostra o mapa de comandos allowlistados
    cmds:
      - '"{{.FREDDO_BIN}}" catalog'

  bootstrap:
    desc: 'Cria a credencial (ex.: task bootstrap -- --password "Senha!" --no-totp --force)'
    cmds:
      - '"{{.FREDDO_BIN}}" bootstrap {{.CLI_ARGS}}'

  serve:
    desc: Sobe API + Executor + Coletor
    cmds:
      - '"{{.FREDDO_BIN}}" serve {{.CLI_ARGS}}'

  audit:
    desc: Verifica a cadeia do audit log
    cmds:
      - '"{{.FREDDO_BIN}}" verify-audit'

  backup:
    desc: Backup consistente dos bancos e do secret.key
    env:
      FREDDO_HOME: "{{.BACKUP_HOME}}"
      FREDDO_MANAGER_BIN: "{{.INSTALL_DIR}}/.venv/bin/freddo-manager"
    cmds:
      - bash "{{.DEPLOY_DIR}}/backup.sh" "{{.BACKUP_DIR}}"

  deploy:prereq:
    desc: Cria contas do sistema e diretórios de deploy (idempotente)
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        for user in "{{.API_USER}}" "{{.COLLECTOR_USER}}"; do
          if ! id -u "$user" >/dev/null 2>&1; then
            $SUDO useradd --system --home-dir /nonexistent --shell /usr/sbin/nologin "$user"
          fi
        done
        if ! id -u "{{.EXEC_USER}}" >/dev/null 2>&1; then
          echo "dono dos benches ausente: {{.EXEC_USER}} (crie antes ou ajuste EXEC_USER)" >&2
          exit 1
        fi
        if ! getent group '{{.STATE_GROUP}}' >/dev/null 2>&1; then
          $SUDO groupadd --system '{{.STATE_GROUP}}'
        fi
        FM_HOME='{{.FM_HOME}}'
        if [ -z "$FM_HOME" ] && [ -t 0 ]; then
          EXEC_HOME="$(getent passwd '{{.EXEC_USER}}' | cut -d: -f6)"
          printf 'Caminho dos benches do Frappe-Manager [%s/frappe]: ' "$EXEC_HOME" >&2
          read -r answer || true
          FM_HOME="${answer:-$EXEC_HOME/frappe}"
        fi
        if [ -z "$FM_HOME" ]; then
          echo "Defina FM_HOME (ex.: FM_HOME=/home/freddo/frappe) ou rode em um TTY." >&2
          exit 1
        fi
        case "$FM_HOME" in /*) ;; *) echo "FM_HOME deve ser absoluto: $FM_HOME" >&2; exit 1 ;; esac
        $SUDO install -d -o root -g root -m 700 "{{.CONFIG_DIR}}"
        printf '%s\n' "$FM_HOME" | $SUDO tee "{{.CONFIG_DIR}}/fm-home" >/dev/null
        $SUDO chmod 644 "{{.CONFIG_DIR}}/fm-home"
        $SUDO install -d -o "{{.EXEC_USER}}" -g "{{.STATE_GROUP}}" -m 2770 "{{.STATE_DIR}}"
        $SUDO install -d -o "{{.EXEC_USER}}" -g "{{.EXEC_USER}}" -m 755 "$FM_HOME"
        echo "deploy:prereq ok (FM_HOME=$FM_HOME)"

  deploy:check:
    desc: Valida usuários, diretórios e build antes do deploy
    cmds:
      - |
        set -eu
        FM_HOME="$(cat "{{.CONFIG_DIR}}/fm-home" 2>/dev/null || printf '%s' '{{.FM_HOME}}')"
        if [ -z "$FM_HOME" ]; then
          echo "rode 'task deploy:prereq' primeiro" >&2
          exit 1
        fi
        for user in "{{.API_USER}}" "{{.EXEC_USER}}" "{{.COLLECTOR_USER}}"; do
          if ! id -u "$user" >/dev/null 2>&1; then
            echo "usuário ausente: $user (crie antes ou ajuste a variável)" >&2
            exit 1
          fi
        done
        for path in "$FM_HOME" "{{.STATE_DIR}}"; do
          if [ ! -d "$path" ]; then
            echo "diretório ausente: $path" >&2
            exit 1
          fi
        done
        if [ ! -x "{{.VENV_DIR}}/bin/freddo-manager" ]; then
          echo "rode 'task install' primeiro" >&2
          exit 1
        fi
        if [ ! -f "{{.WEB_DIR}}/dist/index.html" ]; then
          echo "rode 'task build' primeiro" >&2
          exit 1
        fi
        echo "deploy:check ok"

  deploy:files:
    desc: Copia o código para INSTALL_DIR e instala o venv
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        $SUDO install -d -m 755 "{{.INSTALL_DIR}}"
        if command -v rsync >/dev/null 2>&1; then
          $SUDO rsync -a --exclude .git --exclude .venv --exclude node_modules ./ "{{.INSTALL_DIR}}/"
        else
          $SUDO tar --exclude=.git --exclude=.venv --exclude=node_modules -cf - . | $SUDO tar -xf - -C "{{.INSTALL_DIR}}"
        fi
        $SUDO python3 -m venv "{{.INSTALL_DIR}}/.venv"
        $SUDO "{{.INSTALL_DIR}}/.venv/bin/pip" install --upgrade pip
        $SUDO "{{.INSTALL_DIR}}/.venv/bin/pip" install "{{.INSTALL_DIR}}"
        npm --prefix "{{.INSTALL_DIR}}/web" ci
        npm --prefix "{{.INSTALL_DIR}}/web" run build

  deploy:env:
    desc: Gera api.env, executor.env e collector.env em CONFIG_DIR
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        $SUDO install -d -m 700 "{{.CONFIG_DIR}}"
        FM_HOME="$(cat "{{.CONFIG_DIR}}/fm-home" 2>/dev/null || printf '%s' '{{.FM_HOME}}')"
        if [ -z "$FM_HOME" ]; then echo "rode 'task deploy:prereq' primeiro" >&2; exit 1; fi
        EXEC_UID="$(id -u "{{.API_USER}}" 2>/dev/null || printf '%s' '{{.EXECUTOR_UID}}')"
        EXEC_GID="$(id -g "{{.API_USER}}" 2>/dev/null || printf '%s' '{{.EXECUTOR_GID}}')"
        for name in api executor collector; do
          tmp="$(mktemp)"
          sed \
            -e 's|^FREDDO_HOME=.*|FREDDO_HOME={{.STATE_DIR}}|' \
            -e 's|^FREDDO_FM_BIN=.*|FREDDO_FM_BIN=fmx|' \
            -e "s|^FREDDO_FM_HOME=.*|FREDDO_FM_HOME=$FM_HOME|" \
            -e 's|^FREDDO_PUBLIC_ORIGIN=.*|FREDDO_PUBLIC_ORIGIN={{.PUBLIC_ORIGIN}}|' \
            -e 's|^FREDDO_CORS_ORIGINS=.*|FREDDO_CORS_ORIGINS={{.CORS_ORIGINS}}|' \
            -e "s|^FREDDO_EXECUTOR_UID=.*|FREDDO_EXECUTOR_UID=$EXEC_UID|" \
            -e "s|^FREDDO_EXECUTOR_GID=.*|FREDDO_EXECUTOR_GID=$EXEC_GID|" \
            "{{.INSTALL_DIR}}/.env.example" > "$tmp"
          printf 'FREDDO_CONTAINER_RUNTIME=%s\nFREDDO_DOCKER_SOCKET=%s\n' \
            "{{.CONTAINER_RUNTIME}}" "{{.DOCKER_SOCKET}}" >> "$tmp"
          $SUDO install -m 600 "$tmp" "{{.CONFIG_DIR}}/$name.env"
          rm -f "$tmp"
        done
        echo "envs gerados em {{.CONFIG_DIR}} (uid/gid do executor: $EXEC_UID/$EXEC_GID)"

  deploy:bootstrap:
    desc: Cria a credencial da API como usuario dono dos benches
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        as_exec() { if [ "$(id -u)" -eq 0 ]; then runuser -u '{{.EXEC_USER}}' -- env "$@"; else sudo -u '{{.EXEC_USER}}' -H env "$@"; fi; }
        FM_HOME="$(cat "{{.CONFIG_DIR}}/fm-home" 2>/dev/null || printf '%s' '{{.FM_HOME}}')"
        if [ -z "$FM_HOME" ]; then echo "rode 'task deploy:prereq' primeiro" >&2; exit 1; fi
        as_exec \
          FREDDO_HOME="{{.STATE_DIR}}" \
          FREDDO_FM_HOME="$FM_HOME" \
          sh -c 'umask 0007; exec "$@"' sh \
          "{{.INSTALL_DIR}}/.venv/bin/freddo-manager" bootstrap --fm-home "$FM_HOME" {{.CLI_ARGS}}
        if [ -f "{{.STATE_DIR}}/secret.key" ]; then
          $SUDO chgrp "{{.API_USER}}" "{{.STATE_DIR}}/secret.key"
          $SUDO chmod 640 "{{.STATE_DIR}}/secret.key"
        fi
        for db in state.db telemetria.db; do
          if [ -f "{{.STATE_DIR}}/$db" ]; then
            $SUDO chgrp "{{.STATE_GROUP}}" "{{.STATE_DIR}}/$db"
            $SUDO chmod 660 "{{.STATE_DIR}}/$db"
          fi
        done

  deploy:units:
    desc: Instala units systemd, recarrega e reinicia a stack
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        $SUDO install -d -m 755 "{{.SYSTEMD_DIR}}"
        $SUDO install -m 644 "{{.INSTALL_DIR}}"/deploy/*.service "{{.INSTALL_DIR}}"/deploy/*.target "{{.SYSTEMD_DIR}}/"
        FM_HOME="$(cat '{{.CONFIG_DIR}}/fm-home')"
        $SUDO install -d -m 755 "{{.SYSTEMD_DIR}}/freddo-executor.service.d"
        printf '[Service]\nReadWritePaths=%s\n' "$FM_HOME" | $SUDO tee "{{.SYSTEMD_DIR}}/freddo-executor.service.d/20-fm-home.conf" >/dev/null
        RUNTIME='{{.CONTAINER_RUNTIME}}'
        if [ "$RUNTIME" = auto ]; then
          if command -v docker >/dev/null 2>&1 && [ -S '{{.DOCKER_SOCKET}}' ]; then RUNTIME=docker
          elif command -v podman >/dev/null 2>&1; then RUNTIME=podman
          else RUNTIME=docker; fi
        fi
        if [ "$RUNTIME" = podman ]; then
          EXEC_UID="$(id -u '{{.EXEC_USER}}')"
          PODMAN_SOCKET='{{.PODMAN_SOCKET}}'
          XDG_RUNTIME_DIR='{{.XDG_RUNTIME_DIR}}'
          [ -n "$PODMAN_SOCKET" ] || PODMAN_SOCKET="/run/user/$EXEC_UID/podman/podman.sock"
          [ -n "$XDG_RUNTIME_DIR" ] || XDG_RUNTIME_DIR="/run/user/$EXEC_UID"
          for unit in freddo-api.service freddo-executor.service freddo-collector.service; do
            dropin="{{.SYSTEMD_DIR}}/$unit.d"
            $SUDO install -d -m 755 "$dropin"
            collector_user=''
            collector_group=''
            if [ "$unit" = freddo-collector.service ]; then
              collector_user='User={{.EXEC_USER}}'
              collector_group='Group={{.EXEC_USER}}'
            fi
            printf '[Unit]\nWants=\nAfter=network.target\n\n[Service]\nSupplementaryGroups={{.STATE_GROUP}}\n%s\n%s\nEnvironment=FREDDO_CONTAINER_RUNTIME=podman\nEnvironment=XDG_RUNTIME_DIR=%s\nEnvironment=FREDDO_PODMAN_SOCKET=%s\n' "$collector_user" "$collector_group" "$XDG_RUNTIME_DIR" "$PODMAN_SOCKET" | $SUDO tee "$dropin/10-podman.conf" >/dev/null
          done
        else
          for unit in freddo-api.service freddo-executor.service freddo-collector.service; do
            $SUDO rm -f "{{.SYSTEMD_DIR}}/$unit.d/10-podman.conf"
          done
        fi
        $SUDO systemctl daemon-reload
        $SUDO systemctl enable freddo.target
        $SUDO systemctl restart freddo.target

  deploy:podman:
    desc: Aplica drop-ins systemd para forçar Podman
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        PODMAN_SOCKET='{{.PODMAN_SOCKET}}'
        XDG_RUNTIME_DIR='{{.XDG_RUNTIME_DIR}}'
        EXEC_UID="$(id -u '{{.EXEC_USER}}')"
        [ -n "$PODMAN_SOCKET" ] || PODMAN_SOCKET="/run/user/$EXEC_UID/podman/podman.sock"
        [ -n "$XDG_RUNTIME_DIR" ] || XDG_RUNTIME_DIR="/run/user/$EXEC_UID"
        for unit in freddo-api.service freddo-executor.service freddo-collector.service; do
          dropin="{{.SYSTEMD_DIR}}/$unit.d"
          $SUDO install -d -m 755 "$dropin"
          collector_user=''
          collector_group=''
          if [ "$unit" = freddo-collector.service ]; then
            collector_user='User={{.EXEC_USER}}'
            collector_group='Group={{.EXEC_USER}}'
          fi
          printf '[Unit]\nWants=\nAfter=network.target\n\n[Service]\nSupplementaryGroups={{.STATE_GROUP}}\n%s\n%s\nEnvironment=FREDDO_CONTAINER_RUNTIME=podman\nEnvironment=XDG_RUNTIME_DIR=%s\nEnvironment=FREDDO_PODMAN_SOCKET=%s\n' "$collector_user" "$collector_group" "$XDG_RUNTIME_DIR" "$PODMAN_SOCKET" | $SUDO tee "$dropin/10-podman.conf" >/dev/null
        done
        $SUDO systemctl daemon-reload
        $SUDO systemctl restart freddo.target
        echo "Podman configurado. Socket: $PODMAN_SOCKET"

  deploy:docker:
    desc: Remove os drop-ins do Podman e volta ao Docker
    cmds:
      - |
        set -eu
        SUDO=""
        [ "$(id -u)" -eq 0 ] || SUDO="sudo"
        for unit in freddo-api.service freddo-executor.service freddo-collector.service; do
          $SUDO rm -f "{{.SYSTEMD_DIR}}/$unit.d/10-podman.conf"
        done
        $SUDO systemctl daemon-reload
        $SUDO systemctl restart freddo.target

  deploy:status:
    desc: Mostra o estado da stack
    cmds:
      - systemctl status freddo.target --no-pager
      - journalctl -u freddo-executor.service -n 30 --no-pager

  deploy:logs:
    desc: Segue os logs do Executor (use -- para filtrar)
    cmds:
      - journalctl -fu freddo-executor.service {{.CLI_ARGS}}

  deploy:restart:
    desc: Reinicia a stack
    cmds:
      - sudo systemctl restart freddo.target

  deploy:
    desc: Deploy completo (pre-requisitos + arquivos + env + bootstrap + units)
    cmds:
      - task: deploy:preflight
      - task: deploy:prereq
      - task: deploy:check
      - task: deploy:files
      - task: deploy:env
      - task: deploy:bootstrap
      - task: deploy:units

  tunnel:compose:
    desc: Opera o conector cloudflared no runtime Docker ou Podman local
    cmds:
      - |
        set -eu
        runtime='{{.CONTAINER_RUNTIME}}'
        if [ "$runtime" = auto ]; then
          if command -v docker >/dev/null 2>&1 && [ -S '{{.DOCKER_SOCKET}}' ]; then runtime=docker
          elif command -v podman >/dev/null 2>&1; then runtime=podman
          else runtime=docker; fi
        fi
        case "$runtime" in
          docker) docker compose --env-file "{{.ROOT_DIR}}/.env" -f "{{.DEPLOY_DIR}}/cloudflared.compose.yml" {{.CLI_ARGS}} ;;
          podman) podman compose --env-file "{{.ROOT_DIR}}/.env" -f "{{.DEPLOY_DIR}}/cloudflared.compose.yml" {{.CLI_ARGS}} ;;
          *) echo "CONTAINER_RUNTIME deve ser auto, docker ou podman (atual: $runtime)" >&2; exit 2 ;;
        esac

  saas:deploy:
    desc: Cria bench/site e inicia o conector local (SAAS_DOMAIN=cliente.exemplo.com)
    cmds:
      - |
        set -eu
        : "${SAAS_DOMAIN:?defina SAAS_DOMAIN com o FQDN do site}"
        FM_HOME="$(cat "{{.CONFIG_DIR}}/fm-home" 2>/dev/null || printf '%s' '{{.FM_HOME}}')"
        if [ -z "$FM_HOME" ]; then echo "rode 'task deploy:prereq' primeiro" >&2; exit 1; fi
        FREDDO_HOME="{{.STATE_DIR}}" \
        FREDDO_FM_HOME="$FM_HOME" \
        "{{.FREDDO_BIN}}" saas deploy "$SAAS_DOMAIN" {{.CLI_ARGS}}
        if ! task tunnel:compose -- up -d; then
          echo "Bench criado em $SAAS_DOMAIN, mas o conector não iniciou; verifique o token e a rede fm-global-frontend-network." >&2
          exit 1
        fi
