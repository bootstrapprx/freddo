services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file:
      - "${FREDDO_HOME:?FREDDO_HOME is required}/cloudflared/cloudflared.env"
    networks:
      - frappe-manager-frontend

networks:
  frappe-manager-frontend:
    external: true
    name: fm-global-frontend-network
